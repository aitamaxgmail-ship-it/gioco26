    function drawWheel(angle) {
      const canvas = document.getElementById('wheelCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d'), numSlices = nccAlphabet.length, sliceAngle = (2 * Math.PI) / numSlices;
      ctx.clearRect(0, 0, 80, 80); ctx.save(); ctx.translate(40, 40); ctx.rotate(angle);
      for (let i = 0; i < numSlices; i++) {
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 40, i * sliceAngle, (i + 1) * sliceAngle); ctx.closePath();
        ctx.fillStyle = i % 2 === 0 ? '#6366f1' : '#334155'; ctx.fill(); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1; ctx.stroke();
        ctx.save(); ctx.rotate(i * sliceAngle + sliceAngle / 2); ctx.fillStyle = '#ffffff'; ctx.font = 'bold 8px system-ui'; ctx.textAlign = 'right'; ctx.fillText(nccAlphabet[i], 36, 3); ctx.restore();
      }
      ctx.restore();
    }
    function spinNccWheel() {
      if (nccSpinning) return;
      isGameActive = true;
      nccSpinning = true; document.getElementById('spinBtn').disabled = true;
      const randomIdx = Math.floor(Math.random() * nccAlphabet.length);
      nccCurrentLetter = nccAlphabet[randomIdx];
      if (document.getElementById('opponentMode').value === 'online' && peerConn && peerConn.open) {
        peerConn.send({ type: 'ncc_spin', letter: nccCurrentLetter });
      }
      executeWheelAnimation(randomIdx);
    }
    function receiveRemoteSpin(letter) {
      nccCurrentLetter = letter; executeWheelAnimation(nccAlphabet.indexOf(letter));
    }
    function executeWheelAnimation(targetIdx) {
      const totalSlices = nccAlphabet.length, sliceAngle = (2 * Math.PI) / totalSlices;
      const targetAngle = (3 * Math.PI / 2) - (targetIdx * sliceAngle + sliceAngle / 2);
      const finalAngle = (5 * 2 * Math.PI) + targetAngle;
      let startTime = null;
      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        let progress = (timestamp - startTime) / 2000;
        if (progress > 1) progress = 1;
        drawWheel((1 - Math.pow(1 - progress, 3)) * finalAngle);
        if (progress < 1) requestAnimationFrame(animate);
        else { nccSpinning = false; onWheelStopped(); }
      }
      requestAnimationFrame(animate);
    }
    function onWheelStopped() {
      document.getElementById('nccLetterDisplay').textContent = `Lettera: [ ${nccCurrentLetter} ]`;
      document.getElementById('statusMsg').textContent = `Compila i campi orizzontali e premi STOP!`;
      ['NOME', 'COSA', 'CITTA', 'ANIMALE', 'MESTIERE', 'FRUTTA'].forEach(id => {
        const inp = document.getElementById(`field_${id}`); if(inp) { inp.disabled = false; inp.value = ''; }
      });
      document.getElementById('stopNccBtn').style.display = 'block';
    }
    function triggerNccStop() {
      document.getElementById('stopNccBtn').style.display = 'none';
      if (document.getElementById('opponentMode').value === 'online' && peerConn && peerConn.open) peerConn.send({ type: 'ncc_stop' });
      startNccCountdown();
    }
    function receiveRemoteNccStop() { document.getElementById('stopNccBtn').style.display = 'none'; startNccCountdown(); }
    function startNccCountdown() {
      if (nccTimerInterval) clearInterval(nccTimerInterval);
      nccTimeLeft = 30;
      document.getElementById('nccTimerBox').style.display = 'inline-flex';
      document.getElementById('nccTimerVal').textContent = nccTimeLeft;
      playTickSound();
      nccTimerInterval = setInterval(() => {
        nccTimeLeft--; document.getElementById('nccTimerVal').textContent = nccTimeLeft; playTickSound();
        if (nccTimeLeft <= 0) { clearInterval(nccTimerInterval); finishNccRound(); }
      }, 1000);
    }
    function finishNccRound() {
      ['NOME', 'COSA', 'CITTA', 'ANIMALE', 'MESTIERE', 'FRUTTA'].forEach(id => {
        const inp = document.getElementById(`field_${id}`); if(inp) inp.disabled = true;
      });
      const myWords = {
        NOME: document.getElementById('field_NOME').value.trim(), COSA: document.getElementById('field_COSA').value.trim(),
        CITTA: document.getElementById('field_CITTA').value.trim(), ANIMALE: document.getElementById('field_ANIMALE').value.trim(),
        MESTIERE: document.getElementById('field_MESTIERE').value.trim(), FRUTTA: document.getElementById('field_FRUTTA').value.trim()
      };
      if (document.getElementById('opponentMode').value === 'online') {
        if (peerConn && peerConn.open) peerConn.send({ type: 'ncc_submit', words: myWords });
        if (nccRemoteWords) evaluateNccMatch(myWords, nccRemoteWords);
        else { document.getElementById('statusMsg').textContent = "In attesa delle risposte..."; window.myPendingNccWords = myWords; }
      } else {
        evaluateNccMatch(myWords, generateBotNccWords(nccCurrentLetter));
      }
    }
    function receiveRemoteNccSubmit(words) {
      nccRemoteWords = words;
      if (window.myPendingNccWords) { evaluateNccMatch(window.myPendingNccWords, nccRemoteWords); window.myPendingNccWords = null; }
    }
    function generateBotNccWords(letter) {
      const getW = (cat) => {
        const list = (nccDictionary[cat] || []).filter(w => w.startsWith(letter));
        return list.length > 0 ? list[Math.floor(Math.random() * list.length)] : '';
      };
      return { NOME: getW('NOME'), COSA: getW('COSA'), CITTA: getW('CITTA'), ANIMALE: getW('ANIMALE'), MESTIERE: getW('MESTIERE'), FRUTTA: getW('FRUTTA') };
    }
    function isWordValidInVocab(cat, word, letter) {
      if (!word || word.trim().length < 2) return false;
      const cleanW = word.trim().toUpperCase();
      if (!cleanW.startsWith(letter.toUpperCase())) return false;
      const dict = (nccDictionary[cat] || []).map(w => w.toUpperCase());
      return dict.includes(cleanW) || cleanW.length >= 3;
    }
    function evaluateNccMatch(p1Words, p2Words) {
      const cats = ['NOME', 'COSA', 'CITTA', 'ANIMALE', 'MESTIERE', 'FRUTTA'];
      let p1Scores = {}, p2Scores = {}, p1Tot = 0, p2Tot = 0;
      cats.forEach(c => {
        let v1 = isWordValidInVocab(c, p1Words[c], nccCurrentLetter);
        let v2 = isWordValidInVocab(c, p2Words[c], nccCurrentLetter);
        let w1 = (p1Words[c]||'').trim().toUpperCase(), w2 = (p2Words[c]||'').trim().toUpperCase();
        
        p1Scores[c] = !v1 ? 0 : (v1 && v2 && w1 === w2) ? 5 : 10;
        p2Scores[c] = !v2 ? 0 : (v1 && v2 && w1 === w2) ? 5 : 10;
        p1Tot += p1Scores[c]; p2Tot += p2Scores[c];
      });
      nccCumulativeScores[playerName] += p1Tot; nccCumulativeScores[opponentName] += p2Tot;
      if (p1Tot > p2Tot) { showGameResult(true, playerName, opponentName); addWin('ncc'); }
      else if (p2Tot > p1Tot) { showGameResult(false, opponentName, playerName); addOpponentWin('ncc'); }

      document.getElementById('nccResultsArea').innerHTML = `
        <table class="ncc-grid-table">
          <thead>
            <tr><th>Giocatore</th><th>Nome</th><th>Cosa</th><th>Città</th><th>Animale</th><th>Mestiere</th><th>Frutta</th><th>Mano</th><th class="total-pts-col">TOTALE</th></tr>
          </thead>
          <tbody>
            <tr>
              <td class="ncc-player-row-title">${playerName}</td>
              ${cats.map(c => `<td>${p1Words[c]||'-'} <span class="pts-badge pts-${p1Scores[c]}">[${p1Scores[c]}]</span></td>`).join('')}
              <td style="font-weight:bold;">${p1Tot}</td><td class="total-pts-col">${nccCumulativeScores[playerName]} pt</td>
            </tr>
            <tr>
              <td class="ncc-player-row-title">${opponentName}</td>
              ${cats.map(c => `<td>${p2Words[c]||'-'} <span class="pts-badge pts-${p2Scores[c]}">[${p2Scores[c]}]</span></td>`).join('')}
              <td style="font-weight:bold;">${p2Tot}</td><td class="total-pts-col">${nccCumulativeScores[opponentName]} pt</td>
            </tr>
          </tbody>
        </table>
      `;
    }

    // ==========================================
    // COSTANTI & GRAFICA CARTE NAPOLETANE
    // ==========================================
    const NAP_SUITS = ['denari', 'coppe', 'bastoni', 'spade'];
    const NAP_SUIT_SYMBOLS = { denari: '🪙', coppe: '🏆', bastoni: '🪵', spade: '🗡️' };

    function renderCardHTML(card, clickHandler = '') {
      let iconArt = NAP_SUIT_SYMBOLS[card.suit];
      let valDisplay = card.val;
      let label = card.name;

      if (card.val === 1) { iconArt = `✨${NAP_SUIT_SYMBOLS[card.suit]}✨`; label = 'Asso'; }
      else if (card.val === 8) { iconArt = `💂‍♂️ ${NAP_SUIT_SYMBOLS[card.suit]}`; label = 'Fante'; }
      else if (card.val === 9) { iconArt = `🐎 ${NAP_SUIT_SYMBOLS[card.suit]}`; label = 'Cavallo'; }
      else if (card.val === 10) { iconArt = `👑 ${NAP_SUIT_SYMBOLS[card.suit]}`; label = 'Re'; }

      return `
        <div class="napoletana-card suit-${card.suit}" ${clickHandler}>
          <div class="card-top-left"><span>${valDisplay}</span><span>${NAP_SUIT_SYMBOLS[card.suit]}</span></div>
          <div class="card-center-art">${iconArt}</div>
          <div class="card-bottom-right"><span>${label}</span></div>
        </div>
      `;
    }

    // ==========================================
    // 4. BRISCOLA NAPOLETANA
    // ==========================================
    let bDeck = [], bPlayerHand = [], bBotHand = [], bBriscolaCard = null, bBriscolaSuit = '', bPlayerScore = 0, bBotScore = 0, bTurn = 'player', bLead = 'player', bPlayedThisTrick = [], bIsProcessingTrick = false;
    const BRISCOLA_POINTS = { 1: 11, 3: 10, 10: 4, 9: 3, 8: 2, 7: 0, 6: 0, 5: 0, 4: 0, 2: 0 };
    const BRISCOLA_RANKS  = { 1: 10, 3: 9, 10: 8, 9: 7, 8: 6, 7: 5, 6: 4, 5: 3, 4: 2, 2: 1 };

    function createBriscolaDeck() {
      let deck = [];
      for (let s of NAP_SUITS) {
        for (let v = 1; v <= 10; v++) {
          let name = v===1?'Asso':v===8?'Fante':v===9?'Cavallo':v===10?'Re':v.toString();
          deck.push({ suit: s, val: v, name: name, pts: BRISCOLA_POINTS[v], rank: BRISCOLA_RANKS[v] });
        }
      }
      return deck.sort(() => Math.random() - 0.5);
    }
    function initBriscolaEngine() {
      bDeck = createBriscolaDeck();
      bPlayerHand = [bDeck.pop(), bDeck.pop(), bDeck.pop()];
      bBotHand = [bDeck.pop(), bDeck.pop(), bDeck.pop()];
      bBriscolaCard = bDeck.pop(); bBriscolaSuit = bBriscolaCard.suit;
      bPlayerScore = 0; bBotScore = 0; bLead = 'player'; bTurn = 'player'; bPlayedThisTrick = []; bIsProcessingTrick = false;
      document.getElementById('statusMsg').textContent = `Briscola: ${bBriscolaSuit.toUpperCase()} ${NAP_SUIT_SYMBOLS[bBriscolaSuit]}. Tocca a te!`;
      renderBriscolaBoard();
    }
    function renderBriscolaBoard() {
      const container = document.getElementById('gameContainer');
      let tableHtml = bBriscolaCard ? `
        <div style="position:absolute; left:5px; top:50%; transform:translateY(-50%); text-align:center;">
          <div style="font-size:0.55rem; color:var(--text-muted);">BRISCOLA</div>
          ${renderCardHTML(bBriscolaCard)}
          <div style="font-size:0.55rem; color:var(--text-muted); margin-top:2px;">Mazzo: ${bDeck.length + 1}</div>
        </div>
      ` : `<div style="position:absolute; left:5px; top:50%; transform:translateY(-50%); font-size:0.6rem;">Briscola: <b>${bBriscolaSuit}</b></div>`;

      let playedCardsHtml = bPlayedThisTrick.map(p => renderCardHTML(p.card)).join('');
      let playerHandHtml = bPlayerHand.map((c, i) => renderCardHTML(c, `onclick="playPlayerBriscolaCard(${i})"`)).join('');
      let botHandHtml = bBotHand.map(() => `<div class="napoletana-card back-card">🂠</div>`).join('');

      container.innerHTML = `
        <div class="cards-board">
          <div style="display:flex; justify-space-between; width:100%; font-size:0.75rem; background:#0f172a; padding:0.3rem 0.6rem; border-radius:6px;">
            <span>👤 <b>${playerName}:</b> ${bPlayerScore} pt</span>
            <span>🤖 <b>${opponentName}:</b> ${bBotScore} pt</span>
          </div>
          <div style="display:flex; gap:0.4rem;">${botHandHtml}</div>
          <div class="table-cards-zone" style="position:relative;">${tableHtml}<div style="display:flex; gap:0.4rem; margin-left:55px;">${playedCardsHtml}</div></div>
          <div class="player-hand-zone">${playerHandHtml}</div>
        </div>
      `;
    }
    function playPlayerBriscolaCard(idx) {
      if (bTurn !== 'player' || bIsProcessingTrick) return;
      isGameActive = true;
      bPlayedThisTrick.push({ playedBy: 'player', card: bPlayerHand.splice(idx, 1)[0] });
      renderBriscolaBoard();
      if (bPlayedThisTrick.length === 1) { bTurn = 'bot'; setTimeout(botBriscolaPlay, 600); }
      else { bIsProcessingTrick = true; setTimeout(evaluateBriscolaTrick, 800); }
    }
    function botBriscolaPlay() {
      if (bBotHand.length === 0 || bPlayedThisTrick.length >= 2) return;
      let cardIdx = 0;
      if (bPlayedThisTrick.length === 1) {
        let pCard = bPlayedThisTrick[0].card;
        let sameSuit = bBotHand.filter(c => c.suit === pCard.suit && c.rank > pCard.rank);
        if (sameSuit.length > 0) cardIdx = bBotHand.indexOf(sameSuit[0]);
      }
      bPlayedThisTrick.push({ playedBy: 'bot', card: bBotHand.splice(cardIdx, 1)[0] });
      renderBriscolaBoard();
      if (bPlayedThisTrick.length === 1) { bTurn = 'player'; }
      else { bIsProcessingTrick = true; setTimeout(evaluateBriscolaTrick, 800); }
    }
    function evaluateBriscolaTrick() {
      const c1 = bPlayedThisTrick[0].card, c2 = bPlayedThisTrick[1].card;
      let winner = bPlayedThisTrick[0].playedBy;
      if (c2.suit === bBriscolaSuit && c1.suit !== bBriscolaSuit) winner = bPlayedThisTrick[1].playedBy;
      else if (c1.suit === c2.suit && c2.rank > c1.rank) winner = bPlayedThisTrick[1].playedBy;

      let pts = c1.pts + c2.pts;
      if (winner === 'player') bPlayerScore += pts; else bBotScore += pts;
      bLead = winner; bTurn = winner; bPlayedThisTrick = [];

      if (bPlayerHand.length < 3) {
        if (bDeck.length > 0) { bPlayerHand.push(bDeck.pop()); bBotHand.push(bDeck.pop()); }
        else if (bBriscolaCard) { bPlayerHand.push(bBriscolaCard); bBriscolaCard = null; }
      }
      bIsProcessingTrick = false; renderBriscolaBoard();
      if (bPlayerHand.length === 0 && bBotHand.length === 0) {
        if (bPlayerScore > bBotScore) { showGameResult(true, playerName, opponentName); addWin('briscola'); }
        else { showGameResult(false, opponentName, playerName); addOpponentWin('briscola'); }
      } else if (bTurn === 'bot') setTimeout(botBriscolaPlay, 700);
    }

    // ==========================================
    // 5. SCOPA NAPOLETANA
    // ==========================================
    let sDeck = [], sPlayerHand = [], sBotHand = [], sTable = [], sPlayerCaptured = [], sBotCaptured = [];
    let sPlayerScope = 0, sBotScope = 0, sLastCapturer = 'player', sTurn = 'player', sIsProcessing = false;

    function initScopaEngine() {
      sDeck = [];
      for (let s of NAP_SUITS) {
        for (let v = 1; v <= 10; v++) {
          let name = v===1?'Asso':v===8?'Fante':v===9?'Cavallo':v===10?'Re':v.toString();
          sDeck.push({ suit: s, val: v, name: name });
        }
      }
      sDeck.sort(() => Math.random() - 0.5);
      sTable = [sDeck.pop(), sDeck.pop(), sDeck.pop(), sDeck.pop()];
      sPlayerHand = [sDeck.pop(), sDeck.pop(), sDeck.pop()];
      sBotHand = [sDeck.pop(), sDeck.pop(), sDeck.pop()];
      sPlayerCaptured = []; sBotCaptured = []; sPlayerScope = 0; sBotScope = 0; sLastCapturer = 'player'; sTurn = 'player'; sIsProcessing = false;
      document.getElementById('statusMsg').textContent = `Scopa Napoletana: Tocca a te!`;
      renderScopaBoard();
    }
    function renderScopaBoard() {
      const container = document.getElementById('gameContainer');
      let tableHtml = sTable.map(c => renderCardHTML(c)).join('');
      let playerHandHtml = sPlayerHand.map((c, i) => renderCardHTML(c, `onclick="playPlayerScopaCard(${i})"`)).join('');
      let botHandHtml = sBotHand.map(() => `<div class="napoletana-card back-card">🂠</div>`).join('');

      container.innerHTML = `
        <div class="cards-board">
          <div style="display:flex; justify-content:space-between; width:100%; font-size:0.75rem; background:#0f172a; padding:0.3rem 0.6rem; border-radius:6px;">
            <span>👤 <b>${playerName}:</b> ${sPlayerCaptured.length} carte | ${sPlayerScope} Scope</span>
            <span>🤖 <b>${opponentName}:</b> ${sBotCaptured.length} carte | ${sBotScope} Scope</span>
          </div>
          <div style="display:flex; gap:0.4rem;">${botHandHtml}</div>
          <div class="table-cards-zone">${tableHtml || '<div style="font-size:0.75rem; color:var(--text-muted);">Tavolo Vuoto</div>'}</div>
          <div class="player-hand-zone">${playerHandHtml}</div>
        </div>
      `;
    }
    function findScopaCaptures(card, table) {
      let singles = table.filter(c => c.val === card.val);
      if (singles.length > 0) return singles.map(c => [c]);
      let combos = [];
      function checkCombo(start, current, sum) {
        if (sum === card.val) { combos.push([...current]); return; }
        if (sum > card.val) return;
        for (let i = start; i < table.length; i++) checkCombo(i + 1, [...current, table[i]], sum + table[i].val);
      }
      checkCombo(0, [], 0);
      return combos;
    }
    function playPlayerScopaCard(idx) {
      if (sTurn !== 'player' || sIsProcessing) return;
      isGameActive = true;
      let card = sPlayerHand.splice(idx, 1)[0];
      let caps = findScopaCaptures(card, sTable);
      if (caps.length === 0) {
        sTable.push(card);
      } else {
        let choice = caps[0];
        sPlayerCaptured.push(card, ...choice);
        sLastCapturer = 'player';
        sTable = sTable.filter(c => !choice.includes(c));
        if (sTable.length === 0 && (sDeck.length > 0 || sPlayerHand.length > 0 || sBotHand.length > 0)) {
          sPlayerScope++; playSound('win');
        }
      }
      sTurn = 'bot'; renderScopaBoard();
      checkScopaRoundNext();
    }
    function botScopaPlay() {
      if (sBotHand.length === 0) return;
      let card = sBotHand.splice(0, 1)[0];
      let caps = findScopaCaptures(card, sTable);
      if (caps.length === 0) {
        sTable.push(card);
      } else {
        let choice = caps[0];
        sBotCaptured.push(card, ...choice);
        sLastCapturer = 'bot';
        sTable = sTable.filter(c => !choice.includes(c));
        if (sTable.length === 0 && (sDeck.length > 0 || sPlayerHand.length > 0 || sBotHand.length > 0)) {
          sBotScope++;
        }
      }
      sTurn = 'player'; renderScopaBoard();
      checkScopaRoundNext();
    }
    function checkScopaRoundNext() {
      if (sPlayerHand.length === 0 && sBotHand.length === 0) {
        if (sDeck.length >= 6) {
          sPlayerHand = [sDeck.pop(), sDeck.pop(), sDeck.pop()];
          sBotHand = [sDeck.pop(), sDeck.pop(), sDeck.pop()];
          renderScopaBoard();
          if (sTurn === 'bot') setTimeout(botScopaPlay, 600);
        } else {
          if (sLastCapturer === 'player') sPlayerCaptured.push(...sTable);
          else sBotCaptured.push(...sTable);
          sTable = [];
          
          let pPts = sPlayerScope + (sPlayerCaptured.length > 20 ? 1 : 0);
          let bPts = sBotScope + (sBotCaptured.length > 20 ? 1 : 0);
          
          renderScopaBoard();
          if (pPts >= bPts) { showGameResult(true, playerName, opponentName); addWin('scopa'); }
          else { showGameResult(false, opponentName, playerName); addOpponentWin('scopa'); }
          return;
        }
      } else if (sTurn === 'bot') {
        setTimeout(botScopaPlay, 600);
      }
    }

    // ==========================================
    // 6. IMPICCATO (MOSTRA PAROLA A FINE PARTITA)
    // ==========================================
    let impWord = '', impGuessed = [], impMistakes = 0;
    const impDictionary = ["ARCHITETTURA", "BIBLIOTECA", "COMPUTER", "DIZIONARIO", "ELEFANTE", "FILOSOFIA", "GIORNALE", "IMMAGINAZIONE", "LABIRINTO", "MONTAGNA", "NAVIGATORE", "ORCHESTRA", "PSICOLOGIA", "QUADRO", "RISTORANTE", "SCULTURA", "TELEFONO", "UNIVERSITA", "VELOCIPEDE", "ZAINO", "CARNEVALE", "DESIDERIO", "ENERGIA", "FANTASIA", "GALASSIA", "ILLUSIONE", "MARAVIGLIA", "NOSTALGIA", "ORIZZONTE", "PARADISO", "RIVOLUZIONE", "SIMPATIA", "TEMPESTA", "VACANZA"];

    function initImpiccato() {
      impGuessed = []; impMistakes = 0;
      document.getElementById('statusMsg').textContent = "Impiccato: Scegli la modalità di parola!";
      document.getElementById('gameContainer').innerHTML = `
        <div class="impiccato-container">
          <div style="display:flex; gap:0.4rem; margin-bottom:0.5rem; flex-wrap:wrap; justify-content:center;">
            <button class="btn btn-success" onclick="setupRandomImpWord()">🎲 Parola Casuale Dizionario</button>
            <button class="btn" onclick="setupCustomSecretImpWord()">🔒 Inserisci Parola Segreta</button>
          </div>
          <div id="impGameArea" style="display:none; flex-direction:column; align-items:center; width:100%;"></div>
        </div>
      `;
    }
    function setupRandomImpWord() {
      impWord = impDictionary[Math.floor(Math.random() * impDictionary.length)];
      startImpGame();
    }
    function setupCustomSecretImpWord() {
      let secret = prompt("Inserisci la parola segreta (sarà nascosta):");
      if (secret && secret.trim().length > 1) {
        impWord = secret.trim().toUpperCase().replace(/[^A-Z]/g, '');
        startImpGame();
      }
    }
    function startImpGame() {
      isGameActive = true;
      document.getElementById('impGameArea').style.display = 'flex';
      renderImpBoard();
    }
    function renderImpBoard() {
      const area = document.getElementById('impGameArea');
      let isGameOver = impMistakes >= 6;
      let wordDisplay = impWord.split('').map(l => impGuessed.includes(l) ? l : '_').join(' ');
      
      let slotsHtml = impWord.split('').map(l => {
        let isGuessed = impGuessed.includes(l);
        let showLetter = isGuessed || isGameOver;
        let style = (!isGuessed && isGameOver) ? 'color: #ef4444;' : '';
        return `<div class="letter-slot" style="${style}">${showLetter ? l : ''}</div>`;
      }).join('');
      
      let kbHtml = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').map(l => `
        <button class="kb-key" ${impGuessed.includes(l) || isGameOver ? 'disabled' : ''} onclick="guessImpLetter('${l}')">${l}</button>
      `).join('');

      area.innerHTML = `
        <div class="impiccato-svg-box">
          <svg width="100%" height="100%" viewBox="0 0 100 100">
            <line x1="10" y1="90" x2="90" y2="90" stroke="#94a3b8" stroke-width="4"/>
            <line x1="30" y1="90" x2="30" y2="10" stroke="#94a3b8" stroke-width="4"/>
            <line x1="30" y1="10" x2="70" y2="10" stroke="#94a3b8" stroke-width="4"/>
            <line x1="70" y1="10" x2="70" y2="25" stroke="#94a3b8" stroke-width="2"/>
            ${impMistakes > 0 ? '<circle cx="70" cy="33" r="8" stroke="#ef4444" stroke-width="3" fill="none"/>' : ''}
            ${impMistakes > 1 ? '<line x1="70" y1="41" x2="70" y2="65" stroke="#ef4444" stroke-width="3"/>' : ''}
            ${impMistakes > 2 ? '<line x1="70" y1="48" x2="55" y2="58" stroke="#ef4444" stroke-width="3"/>' : ''}
            ${impMistakes > 3 ? '<line x1="70" y1="48" x2="85" y2="58" stroke="#ef4444" stroke-width="3"/>' : ''}
            ${impMistakes > 4 ? '<line x1="70" y1="65" x2="58" y2="82" stroke="#ef4444" stroke-width="3"/>' : ''}
            ${impMistakes > 5 ? '<line x1="70" y1="65" x2="82" y2="82" stroke="#ef4444" stroke-width="3"/>' : ''}
          </svg>
        </div>
        <div class="word-letters-box">${slotsHtml}</div>
        <div class="kb-row">${kbHtml}</div>
      `;

      if (!wordDisplay.includes('_')) {
        showGameResult(true, playerName, opponentName); addWin('impiccato');
      } else if (impMistakes >= 6) {
        document.getElementById('statusMsg').textContent = `💥 Peccato! La parola era: ${impWord}`;
        showGameResult(false, opponentName, playerName); addOpponentWin('impiccato');
      }
    }
    function guessImpLetter(l) {
      if (impGuessed.includes(l)) return;
      impGuessed.push(l);
      if (!impWord.includes(l)) impMistakes++;
      renderImpBoard();
    }

    // ==========================================
    // 7. TRIS CLASSICO
    // ==========================================
    let trisBoard = Array(9).fill('');
    function initTris() {
      trisBoard = Array(9).fill('');
      document.getElementById('statusMsg').textContent = `Tris: Tocca a te (X).`;
      renderTris();
    }
    function renderTris() {
      let grid = trisBoard.map((c, i) => `<div class="tris-cell" onclick="playTris(${i})">${c}</div>`).join('');
      document.getElementById('gameContainer').innerHTML = `<div class="tris-grid">${grid}</div>`;
    }
    function playTris(i) {
      if (trisBoard[i] !== '') return;
      isGameActive = true;
      trisBoard[i] = 'X'; renderTris();
      if (checkTrisWin('X')) { showGameResult(true, playerName, opponentName); addWin('tris'); return; }
      
      if (document.getElementById('opponentMode').value === 'online') {
        sendPeerMove({ game: 'tris', index: i });
      } else {
        let avail = trisBoard.map((c, idx) => c === '' ? idx : null).filter(v => v !== null);
        if (avail.length === 0) return;
        let botPick = avail[Math.floor(Math.random() * avail.length)];
        trisBoard[botPick] = 'O'; renderTris();
        if (checkTrisWin('O')) { showGameResult(false, opponentName, playerName); addOpponentWin('tris'); }
      }
    }
    function checkTrisWin(p) {
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      return wins.some(([a,b,c]) => trisBoard[a]===p && trisBoard[b]===p && trisBoard[c]===p);
    }

    // Avvio Predefinito
    resetCurrentGame(true);
  </script>
</body>
</html>
